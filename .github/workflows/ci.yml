name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  PNPM_VERSION: 11.28.2
  RUST_TOOLCHAIN: 1.99.0

jobs:
  frontend:
    name: Frontend quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format

      - name: Lint frontend
        run: pnpm lint

      - name: Check Svelte and TypeScript
        run: pnpm check

      - name: Test frontend
        run: pnpm test

  rust:
    name: Rust quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install native dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y
          pkg-config
          libdbus-1-dev
          libwebkit2gtk-4.1-dev
          libayatana-appindicator3-dev
          librsvg2-dev
          patchelf
          libssl-dev
          libxdo-dev

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy,rustfmt

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Run Clippy
        run: >-
          cargo clippy
          --manifest-path src-tauri/Cargo.toml
          --locked
          --all-targets
          --all-features
          -- -D warnings

      - name: Test Rust
        run: >-
          cargo test
          --manifest-path src-tauri/Cargo.toml
          --locked
          --all-targets

  docker-smoke:
    name: Docker integration smoke tests
    needs: rust
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install native dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y
          pkg-config
          libdbus-1-dev
          libwebkit2gtk-4.1-dev
          libayatana-appindicator3-dev
          librsvg2-dev
          patchelf
          libssl-dev
          libxdo-dev

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Run isolated Docker smoke tests
        run: ./scripts/run-docker-smoke.sh

  build-deb:
    name: Build Debian package
    needs: [frontend, rust, docker-smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install native dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y
          appstream
          appstream-compose
          apt-utils
          desktop-file-utils
          gnupg
          pkg-config
          libdbus-1-dev
          libwebkit2gtk-4.1-dev
          libayatana-appindicator3-dev
          librsvg2-dev
          patchelf
          libssl-dev
          libxdo-dev
          xz-utils

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Debian package
        run: pnpm bundle:deb

      - name: Validate Debian package
        run: |
          package_path="$(find src-tauri/target/release/bundle/deb -maxdepth 1 -type f -name '*.deb' -print -quit)"
          package_root="${RUNNER_TEMP}/package-root"
          test -n "${package_path}"
          dpkg-deb --extract "${package_path}" "${package_root}"
          appstreamcli validate --strict --pedantic --no-net \
            "${package_root}/usr/share/metainfo/pl.forseti.dockermon.metainfo.xml"
          desktop-file-validate \
            "${package_root}/usr/share/applications/pl.forseti.dockermon.desktop"

      - name: Test APT repository
        run: |
          package_path="$(find src-tauri/target/release/bundle/deb -maxdepth 1 -type f -name '*.deb' -print -quit)"
          test -n "${package_path}"
          ./scripts/test-apt-repository.sh "${package_path}"

      - name: Upload Debian package
        uses: actions/upload-artifact@v7
        with:
          name: dockermon-deb-${{ github.sha }}
          path: src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
