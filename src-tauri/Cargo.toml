[package]
name = "dockermon"
version = "0.1.0"
description = "A focused local Docker project monitor for Zorin OS"
authors = ["Forseti"]
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"

[lib]
name = "dockermon_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
bollard = { version = "0.21.1", default-features = false, features = ["pipe"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
