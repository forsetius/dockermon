[package]
name = "dockermon"
version = "0.1.4"
description = "A focused local Docker project monitor for Linux"
authors = ["Marcin 'Forseti' Paździora <marcin.pazdziora@forseti.pl>"]
edition = "2024"
rust-version = "1.99"
license-file = "../LICENSE"

[lib]
name = "dockermon_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
auto-launch = "0.6"
bollard = { version = "0.21.1", default-features = false, features = ["pipe"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tokio = { version = "1", features = ["macros", "process", "rt", "sync", "time"] }

[target.'cfg(target_os = "linux")'.dependencies]
tray-icon = { version = "0.25.1", default-features = false, features = ["ksni"] }
